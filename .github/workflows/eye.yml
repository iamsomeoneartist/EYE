name: Eye Pipeline

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# 버그 수정: 이전 실행이 끝나기 전에 새 실행이 겹치는 것을 방지 (중복 주문 방지)
concurrency:
  group: eye-pipeline
  cancel-in-progress: false

# 버그 수정: state.json을 git push 하려면 쓰기 권한이 명시적으로 필요함
permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 4  # 다음 5분 주기와 겹치지 않도록 강제 타임아웃
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Sideline Bot
        env:
          BITHUMB_ACCESS_KEY: ${{ secrets.BITHUMB_ACCESS_KEY }}
          BITHUMB_SECRET_KEY: ${{ secrets.BITHUMB_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LIVE_TRADING: ${{ vars.LIVE_TRADING || 'false' }}
          INITIAL_SEED: ${{ vars.INITIAL_SEED || '100000' }}
          MAX_RISK_PER_TRADE: ${{ vars.MAX_RISK_PER_TRADE || '0.015' }}
          MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT || '0.5' }}
        run: python sideline.py

      - name: Commit and Push State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p logs
          git add state.json logs/trade_journal.csv
          git diff-index --quiet HEAD || git commit -m "Auto: update state via Eye Pipeline [skip ci]"
          git pull --rebase
          git push
