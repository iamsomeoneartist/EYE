name: EYE Trader 24/7 Pipeline Runner

on:
  schedule:
    # 5시간마다 백그라운드 워크플로우 재시작 (GitHub Actions 최장 실행 시간 제한 방지)
    - cron: '0 */5 * * *'
  workflow_dispatch: # GitHub UI에서 수동 실행 허용
  push:
    branches:
      - main

jobs:
  run-eye-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 최대 5시간 30분 구동 후 다음 스케줄로 교체

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests flask

    - name: Execute EYE Trader Pipeline
      run: |
        # EYE.py 실행
        python EYE.py &
        EYE_PID=$!
        
        # 5시간(18,000초) 동안 프로세스 유지
        sleep 18000
        
        # 워크플로우 종료 전 프로세스 정상 정지
        kill -15 $EYE_PID || true

    - name: Commit & Push Trade Journal Logs
      if: always() # 프로세스 종료 시 항상 실행
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "EYE-Bot"
        git add logs/trade_journal.csv || true
        git commit -m "Auto-update trade journal [skip ci]" || true
        git push

