<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EYE Trader Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
        .status-badge { display: inline-block; padding: 5px 10px; border-radius: 12px; background-color: #238636; color: white; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #30363d; padding: 10px; text-align: left; }
        th { background-color: #21262d; color: #8b949e; }
        .positive { color: #3fb950; }
        .negative { color: #f85149; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 EYE AI Trader System Dashboard</h1>
        
        <div class="card">
            <h2>시스템 상태</h2>
            <p>파이프라인 상태: <span class="status-badge">ONLINE</span></p>
            <p>최종 동기화 시간: <span id="sync-time">-</span></p>
        </div>

        <div class="card">
            <h2>📊 최근 매매일지 (Trade Journal)</h2>
            <table id="journal-table">
                <thead>
                    <tr>
                        <th>진입시간</th>
                        <th>종목</th>
                        <th>진입가</th>
                        <th>청산가</th>
                        <th>손익(원)</th>
                        <th>수익률</th>
                        <th>청산사유</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" style="text-align:center;">매매일지 데이터를 불러오는 중...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // GitHub Actions가 푸시하는 logs/trade_journal.csv 파일 로드
        async function loadJournal() {
            try {
                const response = await fetch('logs/trade_journal.csv');
                if (!response.ok) throw new Error('로그 파일 없음');
                const data = await response.text();
                
                const rows = data.trim().split('\n').slice(1);
                const tbody = document.querySelector('#journal-table tbody');
                tbody.innerHTML = '';

                rows.reverse().forEach(row => {
                    const cols = row.split(',');
                    if (cols.length >= 8) {
                        const tr = document.createElement('tr');
                        const pnl = parseFloat(cols[7]);
                        const pnlClass = pnl >= 0 ? 'positive' : 'negative';
                        
                        tr.innerHTML = `
                            <td>${cols[1]}</td>
                            <td>${cols[0]}</td>
                            <td>${parseFloat(cols[2]).toLocaleString()}원</td>
                            <td>${parseFloat(cols[6]).toLocaleString()}원</td>
                            <td class="${pnlClass}">${pnl.toLocaleString()}원</td>
                            <td class="${pnlClass}">${cols[8]}%</td>
                            <td>${cols[9]}</td>
                        `;
                        tbody.appendChild(tr);
                    }
                });
                document.getElementById('sync-time').innerText = new Date().toLocaleString();
            } catch (err) {
                document.querySelector('#journal-table tbody').innerHTML = `<tr><td colspan="7" style="text-align:center;">기록된 매매일지가 없습니다.</td></tr>`;
            }
        }
        loadJournal();
    </script>
</body>
</html>
