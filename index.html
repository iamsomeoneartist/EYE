<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sideline Dashboard</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --sub: #94a3b8;
    --green: #10b981; --red: #ef4444; --blue: #3b82f6; --yellow: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, Roboto, sans-serif; background: var(--bg); color: var(--text);
         padding: 10px; display: flex; flex-direction: column; gap: 7px; font-size: 13px; }

  .header { display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 6px; border-bottom: 1px solid #334155; }
  .header h1 { font-size: 0.95rem; color: var(--blue); }
  .badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
  .badge-live { background: rgba(239,68,68,0.2); color: var(--red); border: 1px solid var(--red); }
  .badge-paper { background: rgba(16,185,129,0.2); color: var(--green); border: 1px solid var(--green); }

  .card { background: var(--card); border-radius: 10px; padding: 9px 11px;
          display: flex; flex-direction: column; gap: 2px; position: relative; }
  .card.clickable { cursor: pointer; }
  .card.clickable:active { background: #253449; }
  .tap-hint { position: absolute; top: 8px; right: 10px; font-size: 0.6rem; color: var(--sub); }
  .card-title { font-size: 0.62rem; color: var(--sub); text-transform: uppercase; letter-spacing: 0.03em; }
  .card-value { font-size: 1.05rem; font-weight: bold; }
  .card-value.small { font-size: 0.9rem; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
  .status-buy { color: var(--green); }
  .status-none { color: var(--sub); }

  .scan-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .scan-chip { background: var(--card); border-radius: 8px; padding: 6px 9px; flex-shrink: 0;
               min-width: 78px; text-align: center; font-size: 0.68rem; }
  .scan-chip .sym { font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .buy-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .scan-chip .rsn { color: var(--sub); font-size: 0.6rem; margin-top: 2px;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 78px; }

  .footer-row { display: flex; justify-content: space-between; align-items: center;
                font-size: 0.62rem; color: var(--sub); }
  .toggle-btn { background: var(--card); border: none; color: var(--sub); font-size: 0.65rem;
                padding: 6px 10px; border-radius: 8px; width: 100%; text-align: center; }

  /* 접이식 팀 현황 (기본 숨김, 스크롤 유발 방지) */
  #teamPanel { display: none; overflow-y: auto; max-height: 40vh; }
  .role-list { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
  .role-row { background: var(--card); border-radius: 8px; padding: 7px 10px;
              display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .role-name { font-size: 0.72rem; font-weight: 600; }
  .role-task { font-size: 0.6rem; color: var(--sub); }
  .role-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-done { background: var(--green); }
  .dot-pending { background: var(--yellow); }
  .dot-blocked { background: var(--red); }
  .progress-bar-wrap { background: #334155; border-radius: 8px; height: 6px; overflow: hidden; margin-top: 6px; }
  .progress-bar-fill { background: var(--blue); height: 100%; }

  /* 모달 */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
                    z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
  .modal-card { background: var(--card); border: 1px solid #334155; border-radius: 12px;
                width: 100%; max-width: 340px; max-height: 78vh; overflow-y: auto; padding: 14px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center;
                  border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 8px; }
  .modal-title { font-size: 0.95rem; font-weight: bold; color: var(--blue); }
  .modal-close { font-size: 1.1rem; color: var(--sub); }
  .modal-row { display: flex; justify-content: space-between; padding: 5px 0;
               border-bottom: 1px solid #223; font-size: 0.8rem; }
  .modal-row span:first-child { color: var(--sub); }
  .modal-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; margin-top: 6px; }
  .modal-table th, .modal-table td { padding: 4px 3px; text-align: center; border-bottom: 1px solid #223; }
  .modal-table th { color: var(--sub); font-weight: normal; }
</style>
</head>
<body>

<div class="header">
  <h1>📱 Eye Pipeline</h1>
  <span id="modeBadge" class="badge badge-paper">-</span>
</div>

<div class="card clickable" id="positionCard" onclick="openPositionModal()">
  <span class="tap-hint">👆 상세</span>
  <div class="card-title">Position</div>
  <div class="card-value status-none" id="targetSymbol">-</div>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-title">Entry</div>
    <div class="card-value small" id="buyPrice">0 KRW</div>
  </div>
  <div class="card">
    <div class="card-title">Highest</div>
    <div class="card-value small" style="color:var(--green)" id="highPrice">0 KRW</div>
  </div>
</div>

<div class="grid-3">
  <div class="card clickable" onclick="openBalanceModal()">
    <div class="card-title">Balance</div>
    <div class="card-value small" style="color:var(--green)" id="balanceVal">0</div>
  </div>
  <div class="card">
    <div class="card-title">Trades</div>
    <div class="card-value small" id="tradeCount">0/2</div>
  </div>
  <div class="card">
    <div class="card-title">Losses</div>
    <div class="card-value small" id="lossCount">0/2</div>
  </div>
</div>

<div class="card-title" style="padding-left:2px">🔍 최근 스캔 (탭하여 상세)</div>
<div class="scan-scroll" id="scanList"></div>

<div class="footer-row">
  <span id="lastUpdated">-</span>
  <span id="modeInfo"></span>
</div>

<button class="toggle-btn" onclick="toggleTeamPanel()">🧩 Team Role Status <span id="progressLabel">(0/16)</span> ▾</button>
<div id="teamPanel">
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
  <div class="role-list" id="roleList"></div>
</div>

<!-- 상세보기 모달 -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal-card">
    <div class="modal-header">
      <div id="modal-title" class="modal-title">상세</div>
      <div class="modal-close" onclick="closeModalDirect()">✕</div>
    </div>
    <div id="modal-body">로딩 중...</div>
  </div>
</div>

<script>
const TEAM_ROLES = [
  { name: "CEO · 수석 트레이더", task: "전략 설계(스퀴즈+RSI+ADX)", status: "done" },
  { name: "CPO · 컴플라이언스", task: "규정/약관 검토", status: "pending" },
  { name: "CFO · 세무", task: "수수료 22% 보정 손익비", status: "pending" },
  { name: "퀀트 A · 지표", task: "스퀴즈/RSI 로직", status: "done" },
  { name: "퀀트 B · SMC", task: "돌파(Breakout) 필터", status: "done" },
  { name: "ML 리서처", task: "적응형 파라미터", status: "pending" },
  { name: "리스크 C · 손절/사이징", task: "ATR 동적 손절+Breakeven Lock", status: "done" },
  { name: "리스크 D · 슬리피지/이벤트", task: "유의종목 자동 청산", status: "done" },
  { name: "스크리너 E · 변동성", task: "거래대금 상위 스크리닝", status: "done" },
  { name: "스크리너 F · 뉴스/악재", task: "실시간 공지 크롤링", status: "blocked" },
  { name: "시스템 아키텍트", task: "워크플로우 동시성/권한", status: "done" },
  { name: "데이터 엔지니어", task: "틱데이터 DB/백테스트 엔진", status: "pending" },
  { name: "프론트엔드", task: "모바일 대시보드", status: "done" },
  { name: "DevOps", task: "GitHub Actions 파이프라인", status: "done" },
  { name: "AI 비서", task: "디스코드 실시간 보고", status: "done" },
  { name: "백테스트 데이터 담당 (신규)", task: "실제 30일 성과 검증", status: "blocked" },
];

let LATEST_STATE = null;

function renderRoles() {
  const list = document.getElementById('roleList');
  const dotClass = { done: "dot-done", pending: "dot-pending", blocked: "dot-blocked" };
  list.innerHTML = TEAM_ROLES.map(r => `
    <div class="role-row">
      <div>
        <div class="role-name">${r.name}</div>
        <div class="role-task">${r.task}</div>
      </div>
      <div class="role-dot ${dotClass[r.status]}"></div>
    </div>
  `).join('');
  const doneCount = TEAM_ROLES.filter(r => r.status === "done").length;
  document.getElementById('progressLabel').innerText = `(${doneCount}/${TEAM_ROLES.length})`;
  document.getElementById('progressFill').style.width = `${(doneCount / TEAM_ROLES.length) * 100}%`;
}
renderRoles();

function toggleTeamPanel() {
  const el = document.getElementById('teamPanel');
  el.style.display = (el.style.display === 'block') ? 'none' : 'block';
}

function showModal(title, bodyHtml) {
  document.getElementById('modal-title').innerText = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-overlay').style.display = 'flex';
}
function closeModal(e) { if (e.target.id === 'modal-overlay') closeModalDirect(); }
function closeModalDirect() { document.getElementById('modal-overlay').style.display = 'none'; }

function openPositionModal() {
  const d = LATEST_STATE;
  if (!d) return;
  if (d.position !== "BUY") {
    showModal("포지션 상세", `<div class="modal-row"><span>상태</span><span>보유 포지션 없음 (스캔 중)</span></div>`);
    return;
  }
  const rows = [
    ["종목", d.target_symbol],
    ["진입 시각", d.entry_time || "-"],
    ["진입가", `${Number(d.buy_price||0).toLocaleString()} ₩`],
    ["현재가", `${Number(d.current_price||0).toLocaleString()} ₩`],
    ["최고가", `${Number(d.highest_price||0).toLocaleString()} ₩`],
    ["보유수량", d.units],
    ["현재 RSI", d.current_rsi],
    ["손절선(ATR 기반)", `${Number(d.current_stop_loss||0).toLocaleString()} ₩`],
    ["추적손절선", `${Number(d.current_trailing_stop||0).toLocaleString()} ₩`],
  ];
  showModal(`📈 ${d.target_symbol} 상세`,
    rows.map(([k,v]) => `<div class="modal-row"><span>${k}</span><span>${v}</span></div>`).join(''));
}

async function openBalanceModal() {
  showModal("💰 매매일지", "불러오는 중...");
  try {
    const res = await fetch('./logs/trade_journal.csv?t=' + Date.now());
    if (!res.ok) throw new Error('no file');
    const text = await res.text();
    const rows = text.trim().split('\n');
    if (rows.length <= 1) {
      showModal("💰 매매일지", `<div class="modal-row"><span>기록</span><span>아직 청산된 거래 없음</span></div>`);
      return;
    }
    const header = rows[0].split(',');
    const idx = (name) => header.indexOf(name);
    const dataRows = rows.slice(1).reverse().slice(0, 10);
    const html = `
      <table class="modal-table">
        <thead><tr><th>종목</th><th>청산시각</th><th>손익(원)</th><th>손익%</th><th>사유</th></tr></thead>
        <tbody>
          ${dataRows.map(r => {
            const c = r.split(',');
            const pnl = parseFloat(c[idx('pnl_krw')]);
            const color = pnl >= 0 ? 'var(--green)' : 'var(--red)';
            return `<tr>
              <td>${(c[idx('symbol')]||'').replace('_KRW','')}</td>
              <td>${(c[idx('exit_time')]||'').split(' ')[1]||''}</td>
              <td style="color:${color}">${pnl>0?'+':''}${pnl.toLocaleString()}</td>
              <td style="color:${color}">${c[idx('pnl_pct')]}%</td>
              <td>${c[idx('reason')]}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
    showModal("💰 매매일지 (최근 10건)", html);
  } catch (err) {
    showModal("💰 매매일지", `<div class="modal-row"><span>상태</span><span>아직 기록 없음 (첫 거래 전)</span></div>`);
  }
}

function openScanModal(symbol) {
  const scans = (LATEST_STATE && LATEST_STATE.last_scan) || [];
  const s = scans.find(x => x.symbol === symbol);
  if (!s) return;
  const rows = [
    ["현재가", `${Number(s.price).toLocaleString()} ₩`],
    ["RSI", s.rsi],
    ["모멘텀", s.momentum],
    ["ATR", s.atr],
    ["손절 추정가", `${Number(s.stop_loss_estimate).toLocaleString()} ₩`],
    ["매수가능 여부", s.is_buyable ? "🟢 조건 충족" : "🟡 대기"],
    ["판단 근거", s.reason],
  ];
  showModal(`🔍 ${symbol.replace('_KRW','')} 스캔 상세`,
    rows.map(([k,v]) => `<div class="modal-row"><span>${k}</span><span>${v}</span></div>`).join(''));
}

async function updateDashboard() {
  try {
    // 버그 수정: GitHub Pages는 docs 폴더를 웹 루트로 서빙하므로 같은 위치(./)에서 읽는다
    const res = await fetch('./state.json?t=' + Date.now());
    if (!res.ok) throw new Error('state.json not found (' + res.status + ')');
    const data = await res.json();
    LATEST_STATE = data;

    const modeBadge = document.getElementById('modeBadge');
    const isLive = data.mode === "LIVE";
    modeBadge.innerText = isLive ? "🔴 LIVE" : "🟢 PAPER";
    modeBadge.className = "badge " + (isLive ? "badge-live" : "badge-paper");

    const symbolElem = document.getElementById('targetSymbol');
    if (data.position === "BUY") {
      symbolElem.innerText = `BUY : ${data.target_symbol}`;
      symbolElem.className = "card-value status-buy";
    } else {
      symbolElem.innerText = "SEARCHING";
      symbolElem.className = "card-value status-none";
    }

    document.getElementById('buyPrice').innerText = `${(data.buy_price || 0).toLocaleString()}`;
    document.getElementById('highPrice').innerText = `${(data.highest_price || 0).toLocaleString()}`;
    document.getElementById('tradeCount').innerText = `${data.daily_trade_count || 0}/2`;
    document.getElementById('lossCount').innerText = `${data.daily_loss_count || 0}/2`;
    document.getElementById('balanceVal').innerText = `${Math.round(data.balance || 0).toLocaleString()}`;

    const scanList = document.getElementById('scanList');
    const scans = data.last_scan || [];
    if (scans.length === 0) {
      scanList.innerHTML = `<div class="scan-chip">대기중</div>`;
    } else {
      scanList.innerHTML = scans.map(s => `
        <div class="scan-chip" onclick="openScanModal('${s.symbol}')">
          <div class="sym">${s.is_buyable ? '<span class="buy-dot"></span>' : ''}${s.symbol.replace('_KRW','')}</div>
          <div class="rsn">${s.reason}</div>
        </div>
      `).join('');
    }

    document.getElementById('lastUpdated').innerText = "업데이트: " + (data.last_run_at || "-");
  } catch (err) {
    document.getElementById('lastUpdated').innerText = "state.json 로드 실패: " + err.message;
  }
}
updateDashboard();
setInterval(updateDashboard, 10000);
</script>
</body>
</html>
